# =============================================================================
# GitHub Actions CI/CD — Catálogo de Templates de Projetos
# Validação Automatizada de Tipagem, Testes e Builds de Todos os Templates
# =============================================================================

name: Catálogo de Templates CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Validação do Template 1 (PostgreSQL Docker + Clean MVC)
  # ---------------------------------------------------------------------------
  template-postgresql:
    name: "Template: PostgreSQL + Docker"
    runs-on: ubuntu-latest
    env:
      TEMPLATE_DIR: "React vite tailwind typescript, typescript restFul, postgreeSQL, Clean MVC Feature-Driven, docker"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend — Instalar dependências
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Backend — Typecheck (TypeScript estrito)
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: npm run typecheck

      - name: Backend — Executar testes (Vitest)
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: npm test

      - name: Backend — Compilar (tsc)
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: npm run build

      - name: Frontend — Instalar dependências
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Frontend — Typecheck (TypeScript estrito)
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: npm run typecheck

      - name: Frontend — Executar testes (Vitest)
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: npm test

      - name: Frontend — Build de produção (Vite)
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_USE_MOCK_DATA: false

      - name: Docker — Validar sintaxe do Docker Compose
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          cp -n Database/.env.example Database/.env || true
          cp -n Backend/.env.example Backend/.env || true
          cp -n Frontend/.env.example Frontend/.env || true
          docker compose config
        env:
          VITE_API_URL: /api
          VITE_USE_MOCK_DATA: false

  # ---------------------------------------------------------------------------
  # Job 2: Validação do Template 2 (Supabase Cloud + Clean MVC)
  # ---------------------------------------------------------------------------
  template-supabase:
    name: "Template: Supabase + Clean MVC"
    runs-on: ubuntu-latest
    env:
      TEMPLATE_DIR: "React vite tailwind typescript, typescript restFul, supabase, Clean MVC Feature-Driven, docker"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Backend — Instalar dependências
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Backend — Typecheck (TypeScript estrito)
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: npm run typecheck

      - name: Backend — Executar testes (Vitest)
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: npm test

      - name: Backend — Compilar (tsc)
        working-directory: ${{ env.TEMPLATE_DIR }}/Backend
        run: npm run build

      - name: Frontend — Instalar dependências
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci --prefer-offline --no-audit --no-fund
          else
            npm install --prefer-offline --no-audit --no-fund
          fi

      - name: Frontend — Typecheck (TypeScript estrito)
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: npm run typecheck

      - name: Frontend — Executar testes (Vitest)
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: npm test

      - name: Frontend — Build de produção (Vite)
        working-directory: ${{ env.TEMPLATE_DIR }}/Frontend
        run: npm run build
        env:
          VITE_API_URL: /api
          VITE_USE_MOCK_DATA: false
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key

      - name: Docker — Validar sintaxe do Docker Compose
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: |
          cp -n Backend/.env.example Backend/.env || true
          cp -n Frontend/.env.example Frontend/.env || true
          docker compose config
        env:
          VITE_API_URL: /api
          VITE_USE_MOCK_DATA: false
          VITE_SUPABASE_URL: https://mock.supabase.co
          VITE_SUPABASE_ANON_KEY: mock-anon-key

  # ---------------------------------------------------------------------------
  # Job 3: Validação do Template 3 (Board de Tasks & Documentação)
  # ---------------------------------------------------------------------------
  template-docs:
    name: "Template: Board & Documentação"
    runs-on: ubuntu-latest
    env:
      TEMPLATE_DIR: "Template Board de Tasks, Gestao de Sprints, Documentacao Docs, AGENTS.md"

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Executar script de extração de docstrings
        working-directory: ${{ env.TEMPLATE_DIR }}
        run: node scripts/generate-docstrings-doc.js
