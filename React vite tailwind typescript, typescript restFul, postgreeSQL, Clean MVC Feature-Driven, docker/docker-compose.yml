# =============================================================================
# docker-compose.yml — Orquestrador Geral (Delega para Database/, Backend/ e Frontend/)
#
# Cada camada possui seu próprio Dockerfile e .env isolados em sua pasta:
#   - Banco de Dados: ./Database/Dockerfile + ./Database/.env (ou suba isolado em Database/docker-compose.yml)
#   - Backend API:    ./Backend/Dockerfile  + ./Backend/.env
#   - Frontend SPA:   ./Frontend/Dockerfile + ./Frontend/.env
#
# Comandos:
#   Subir APENAS o Banco isolado:      cd Database && docker compose up -d --build  (ou npm run db:up)
#   Subir TUDO junto (DB+Back+Front):  docker compose up --build
#   Parar tudo:                        docker compose down
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # 1. Banco de Dados PostgreSQL 16 (Construído a partir da pasta isolada ./Database)
  # ---------------------------------------------------------------------------
  postgres:
    build:
      context: ./Database
      dockerfile: Dockerfile
    container_name: template-postgres
    restart: unless-stopped
    env_file:
      - path: ./Database/.env
        required: false
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-template_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ---------------------------------------------------------------------------
  # 2. Painel Visual do Banco no Navegador (Adminer em http://localhost:8080)
  # ---------------------------------------------------------------------------
  adminer:
    image: adminer:latest
    container_name: template-db-painel
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # ---------------------------------------------------------------------------
  # 3. Backend (Construído a partir da pasta isolada ./Backend)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
      target: production
    container_name: template-backend
    restart: unless-stopped
    env_file:
      - path: ./Backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/template_db
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: template_db
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ---------------------------------------------------------------------------
  # 4. Frontend (Construído a partir da pasta isolada ./Frontend)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_WS_URL: ${VITE_WS_URL:-}
        VITE_USE_MOCK_DATA: ${VITE_USE_MOCK_DATA:-false}
    container_name: template-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5173/nginx-health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  postgres_data:
    name: template-postgres-data

networks:
  app-network:
    driver: bridge
    name: template-network
